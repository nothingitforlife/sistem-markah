<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Migration: Firebase → Google Sheets</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; padding: 2rem; max-width: 900px; margin: 0 auto; }
    .card { background: white; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { color: #1a1a2e; margin-bottom: 1rem; }
    h2 { color: #1a1a2e; font-size: 1.2rem; margin-bottom: 0.5rem; }
    .stat { display: inline-block; background: #e0e7ff; padding: 0.5rem 1rem; border-radius: 8px; margin: 0.25rem; font-size: 0.9rem; }
    .stat-value { font-weight: 700; color: #312e81; }
    button { padding: 0.75rem 1.5rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-success { background: #059669; color: white; }
    .btn-danger { background: #dc2626; color: white; }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .log { background: #1a1a2e; color: #e5e7eb; padding: 1rem; border-radius: 8px; font-family: monospace; font-size: 0.8rem; max-height: 400px; overflow-y: auto; margin-top: 1rem; }
    .log-line { padding: 2px 0; }
    .log-success { color: #86efac; }
    .log-error { color: #fca5a5; }
    .log-info { color: #93c5fd; }
    .log-warn { color: #fcd34d; }
    .progress { background: #e5e7eb; border-radius: 8px; height: 8px; margin-top: 1rem; overflow: hidden; }
    .progress-bar { background: #3b82f6; height: 100%; width: 0%; transition: width 0.3s; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.5rem; }
  </style>
</head>
<body>
  <h1>🔄 Migration: LocalStorage → Google Sheets</h1>

  <div class="card">
    <h2>Apps Script URL</h2>
    <input type="url" id="apiUrl" value="https://script.google.com/macros/s/AKfycbyARek0MXJX60wTSsrm5kOelyC7F4XnIpL7L38oSQHMyzIVQPPkwkXm3qnSzG680jpw/exec" style="width:100%;padding:0.75rem;border:1px solid #ccc;border-radius:6px;font-size:0.9rem;margin-bottom:0.75rem;font-family:inherit;">
    <button class="btn-primary" onclick="doMigration()">🚀 Migrate Now</button>
    <button class="btn-primary" onclick="testConnection()" style="margin-left:8px;">Test Connection</button>
    <span id="connStatus"></span>
  </div>

  <div class="card" id="verifyCard" style="display:none;">
    <h2>Verification</h2>
    <div id="verifyResult"></div>
    <div style="margin-top:1rem;">
      <button class="btn-success" onclick="switchBackend()">✅ Switch to Google Sheets</button>
    </div>
  </div>

  <div class="card">
    <h2>Migration Log</h2>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    <div class="log" id="logArea">
      <div class="log-line log-info">Ready. Click "Migrate Now" to start.</div>
    </div>
  </div>

  <script>
    let localData = null;
    let API_URL = '';

    function log(msg, type) {
      const area = document.getElementById('logArea');
      const line = document.createElement('div');
      line.className = 'log-line log-' + (type || 'info');
      const time = new Date().toLocaleTimeString();
      line.textContent = '[' + time + '] ' + msg;
      area.appendChild(line);
      area.scrollTop = area.scrollHeight;
    }

    function setProgress(pct) {
      document.getElementById('progressBar').style.width = pct + '%';
    }

    function getStats(data) {
      return {
        students: (data.students || []).length,
        subjects: (data.subjects || []).length,
        semesters: (data.semesters || []).length,
        teachers: (data.teachers || []).length,
        marks: (data.marks || []).length,
        timetable: (data.timetable || []).length,
        memos: (data.memos || []).length,
        examSchedule: (data.examSchedule || []).length,
        messages: (data.messages || []).length,
        assignments: (data.assignments || []).length,
        assignmentSubmissions: (data.assignmentSubmissions || []).length,
        fypAssessments: ((data.fyp || {}).assessments || []).length,
        fypAuditLog: ((data.fyp || {}).auditLog || []).length,
        carrymarkTemplates: ((data.carrymark || {}).templates || []).length,
        carrymarkMarks: ((data.carrymark || {}).marks || []).length,
        carrymarkGradeConfig: ((data.carrymark || {}).gradeConfig || []).length,
        carrymarkAuditLog: ((data.carrymark || {}).auditLog || []).length,
        calculatedResults: (data.calculatedResults || []).length,
        resultAuditLog: (data.resultAuditLog || []).length,
        merit: (data.merit || []).length,
        pdpevaluations: (data.pdpevaluations || []).length,
        attendanceSessions: ((data.attendance || {}).sessions || []).length,
        attendanceRecords: ((data.attendance || {}).records || []).length,
        attendanceLogs: ((data.attendance || {}).logs || []).length
      };
    }

    async function testConnection() {
      API_URL = document.getElementById('apiUrl').value.trim();
      if (!API_URL) { alert('Enter URL'); return; }
      log('Testing connection...');
      try {
        const resp = await fetch(API_URL + '?action=health');
        const json = await resp.json();
        if (json.success) {
          log('✅ Connection successful!', 'success');
          document.getElementById('connStatus').innerHTML = '<span style="color:#059669;font-weight:600;">✓ Connected</span>';
        } else {
          log('❌ Connection failed: ' + (json.error || 'Unknown'), 'error');
          document.getElementById('connStatus').innerHTML = '<span style="color:#dc2626;font-weight:600;">✗ Failed</span>';
        }
      } catch (e) {
        log('❌ Error: ' + e.message, 'error');
        document.getElementById('connStatus').innerHTML = '<span style="color:#dc2626;font-weight:600;">✗ Error</span>';
      }
    }

    async function doMigration() {
      API_URL = document.getElementById('apiUrl').value.trim();
      if (!API_URL) { alert('Enter URL'); return; }

      // Step 1: Load from localStorage
      log('Loading data from localStorage backup...');
      setProgress(10);
      try {
        const raw = localStorage.getItem('sistemMarkahBackup');
        if (!raw) {
          log('❌ No localStorage backup found! Please open the main app first and login.', 'error');
          return;
        }
        const backup = JSON.parse(raw);
        localData = backup.data || backup;
        if (!localData || !localData.students) {
          log('❌ Backup is empty or corrupt!', 'error');
          return;
        }

        const stats = getStats(localData);
        log('✅ Data loaded from localStorage!', 'success');
        for (const [key, val] of Object.entries(stats)) {
          log('  ' + key + ': ' + val + ' records', 'info');
        }
        setProgress(30);
      } catch (e) {
        log('❌ Load error: ' + e.message, 'error');
        return;
      }

      // Step 2: Send to Google Sheets
      log('Sending data to Google Sheets...', 'warn');
      setProgress(40);
      try {
        const resp = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'migrate', data: localData })
        });
        setProgress(70);
        const json = await resp.json();

        if (json.success) {
          log('✅ Migration completed!', 'success');
          setProgress(90);

          // Step 3: Verify
          log('Verifying...', 'warn');
          const countResp = await fetch(API_URL + '?action=count');
          const countJson = await countResp.json();

          if (countJson.success && countJson.counts) {
            const sheetCounts = countJson.counts;
            const fbCounts = getStats(localData);
            let allMatch = true;

            let html = '<table style="width:100%;border-collapse:collapse;font-size:0.85rem;"><thead><tr><th style="padding:6px;border-bottom:2px solid #333;text-align:left;">Module</th><th style="padding:6px;border-bottom:2px solid #333;text-align:center;">Local</th><th style="padding:6px;border-bottom:2px solid #333;text-align:center;">Sheets</th><th style="padding:6px;border-bottom:2px solid #333;text-align:center;">Match</th></tr></thead><tbody>';

            for (const key of Object.keys(fbCounts)) {
              const fb = fbCounts[key];
              const sh = sheetCounts[key] || 0;
              const match = fb === sh;
              if (!match) allMatch = false;
              const icon = match ? '✅' : '❌';
              const color = match ? '#059669' : '#dc2626';
              html += '<tr><td style="padding:6px;border-bottom:1px solid #ddd;">' + key + '</td><td style="padding:6px;border-bottom:1px solid #ddd;text-align:center;">' + fb + '</td><td style="padding:6px;border-bottom:1px solid #ddd;text-align:center;">' + sh + '</td><td style="padding:6px;border-bottom:1px solid #ddd;text-align:center;color:' + color + ';font-weight:600;">' + icon + '</td></tr>';
              if (match) {
                log('  ✅ ' + key + ': ' + fb + ' = ' + sh, 'success');
              } else {
                log('  ❌ ' + key + ': Local=' + fb + ', Sheets=' + sh, 'error');
              }
            }
            html += '</tbody></table>';

            if (allMatch) {
              html += '<div style="margin-top:1rem;padding:0.75rem;background:#dcfce7;border-radius:8px;color:#166534;font-weight:600;">✅ All records match!</div>';
              log('✅ Verification passed!', 'success');
            } else {
              html += '<div style="margin-top:1rem;padding:0.75rem;background:#fee2e2;border-radius:8px;color:#991b1b;font-weight:600;">⚠️ Some mismatches found.</div>';
              log('⚠️ Some mismatches found.', 'warn');
            }

            document.getElementById('verifyResult').innerHTML = html;
            document.getElementById('verifyCard').style.display = 'block';
          }
          setProgress(100);
        } else {
          log('❌ Migration failed: ' + (json.error || 'Unknown'), 'error');
        }
      } catch (e) {
        log('❌ Migration error: ' + e.message, 'error');
      }
    }

    async function switchBackend() {
      API_URL = document.getElementById('apiUrl').value.trim();
      localStorage.setItem('googleSheetsApiUrl', API_URL);
      localStorage.setItem('backendType', 'google-sheets');
      log('✅ Backend switched to Google Sheets!', 'success');
      log('Reloading in 3 seconds...', 'info');
      setTimeout(() => window.location.href = '/', 3000);
    }
  </script>
</body>
</html>
